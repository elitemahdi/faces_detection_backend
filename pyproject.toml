[project]
name = "faces-detection"
version = "0.1.0"
description = "Face recognition microservice using AdaFace and OpenCV"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "uvicorn>=0.52.4",
    "python-multipart>=0.0.9",
    "numpy>=1.26.0",
    "pillow>=10.0.0",
    "scikit-image>=0.22.0",
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "pgvector>=0.2.5",
    "pydantic-settings>=2.2.0",
    "aiofiles>=25.1.0",
    "opencv-python>=5.0.0.93",
    "opencv-contrib-python>=5.0.0.93",
    "onnxruntime>=1.29.0",
    "myapplication>=0.1.0",
    "the-new-hotness>=1.4.1",
]
